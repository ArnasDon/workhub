<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- WorkHub mark: a W drawn as a trail of log entries, the centre node is the hub. -->
  <rect width="64" height="64" rx="15" fill="#b44e2e"/>
  <g fill="#fefcf6" stroke="#fefcf6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="12,20 22.5,45 32,25 41.5,45 52,20" fill="none" stroke-width="5"/>
    <circle cx="12" cy="20" r="4.5" stroke="none"/>
    <circle cx="22.5" cy="45" r="4.5" stroke="none"/>
    <circle cx="32" cy="25" r="7" stroke="none"/>
    <circle cx="41.5" cy="45" r="4.5" stroke="none"/>
    <circle cx="52" cy="20" r="4.5" stroke="none"/>
  </g>
</svg>
